name: 'Setup SSH'
description: 'Setup SSH key for Git operations. When the key is empty, for example on pull requests from forks, it skips SSH setup and sends GitHub SSH URLs over HTTPS.'

inputs:
  ssh-key:
    required: true
runs:
  using: 'composite'
  steps:
    - run: |
        if [ -z "$SSH_KEY" ]; then
          echo "No SSH key given. Skipping SSH setup. Sending GitHub SSH URLs over HTTPS."
          # Public repos referenced over SSH (for example Terraform module
          # sources) then still clone. Terraform turns "git@github.com:" into
          # "ssh://git@github.com/" before it calls git, so both need a rule.
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global --add url."https://github.com/".insteadOf "ssh://git@github.com/"
          exit 0
        fi

        mkdir -p ~/.ssh
        printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519
        ssh-keyscan -H github.com >> ~/.ssh/known_hosts
        git config --global url."git@github.com:".insteadOf "https://github.com/"
      shell: bash
      env:
        SSH_KEY: ${{ inputs.ssh-key }}
