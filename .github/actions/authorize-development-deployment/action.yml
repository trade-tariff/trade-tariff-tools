name: Authorize development deployment
description: Validate deployment accounts against the central tools repository policy and return an exact commit SHA.

outputs:
  sha:
    description: The authorized full commit SHA to pass to deployment jobs.
    value: ${{ steps.authorize.outputs.sha }}

runs:
  using: composite
  steps:
    # Authorization reads the tools policy from main, never the caller or PR.
    - uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
      id: authorize
      env:
        AUTHORIZATION_SCRIPT: ${{ github.action_path }}/authorize.cjs
        TRIGGERING_ACTOR: ${{ github.triggering_actor }}
      with:
        script: |
          const authorize = require(process.env.AUTHORIZATION_SCRIPT);
          await authorize({ github, context, core, triggeringActor: process.env.TRIGGERING_ACTOR });
