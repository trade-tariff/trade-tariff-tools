name: 'Stop ECS services'
description: 'Stop specified ECS services in a given environment.'

inputs:
  service-names:
    required: true
    description: 'Space-separated list of ECS service names to stop.'
  environment:
    required: true
  region:
    required: false
    default: 'eu-west-2'
runs:
  using: 'composite'
  steps:
    - uses: actions/checkout@v6
    - id: config
      uses: trade-tariff/trade-tariff-tools/.github/actions/configure-environment@main
      with:
        environment: ${{ inputs.environment }}
        region: ${{ inputs.region }}
        service-names: ${{ inputs.service-names }}
    - uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: ${{ steps.config.outputs.deploy-role-arn }}
        aws-region: ${{ inputs.region }}
    - shell: bash
      env:
        CLUSTER: ${{ steps.config.outputs.cluster }}
        REGION: ${{ inputs.region }}
        SERVICE_NAMES: ${{ inputs.service-names }}
      # SERVICE_NAMES is unquoted on purpose: split on spaces and newlines.
      run: |
        "${{ github.action_path }}/../start-services/scale-services.sh" \
          --cluster "$CLUSTER" \
          --region "$REGION" \
          --desired-count 0 \
          --verb stop \
          $SERVICE_NAMES
