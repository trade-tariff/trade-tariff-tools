name: 'Checkout application repository'
description: 'Checks out the repository that a deploy builds. A private repo other than the calling repo needs a GitHub App token, because the default token can only read the calling repo.'

inputs:
  repository:
    description: 'The repository to check out, as owner/name.'
    required: true
  ref:
    description: 'The git ref to check out. Leave empty to use the default of actions/checkout. For the calling repository that is the ref or commit that triggered the workflow, which can be a feature branch or a pull request merge commit. For another repository it is that repository's default branch.'
    required: false
    default: ''
  fetch-depth:
    description: 'The number of commits to fetch. 0 fetches all history.'
    required: false
    default: '1'
  app-id:
    description: 'The GitHub App ID of an app that can read the repository. Leave empty to use the default token.'
    required: false
    default: ''
  private-key:
    description: 'The private key of that GitHub App. Leave empty to use the default token.'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Split the repository into owner and name
      id: target
      shell: bash
      env:
        REPOSITORY: ${{ inputs.repository }}
      run: |
        {
          echo "owner=${REPOSITORY%%/*}"
          echo "name=${REPOSITORY#*/}"
        } >> "$GITHUB_OUTPUT"

    # The calling repo can always read itself, so it needs no app token. The
    # token can only read the one repo. The action masks it and revokes it when
    # the job ends.
    - name: Mint a read-only token for the repository
      id: token
      if: ${{ inputs.app-id != '' && inputs.private-key != '' && inputs.repository != github.repository }}
      uses: actions/create-github-app-token@v3.3.0
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
        owner: ${{ steps.target.outputs.owner }}
        repositories: ${{ steps.target.outputs.name }}
        permission-contents: read

    - uses: actions/checkout@v7.0.1
      with:
        repository: ${{ inputs.repository }}
        ref: ${{ inputs.ref }}
        fetch-depth: ${{ inputs.fetch-depth }}
        token: ${{ steps.token.outputs.token || github.token }}
