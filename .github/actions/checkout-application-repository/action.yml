name: 'Checkout application repository'
description: 'Checks out the repository that a deploy builds. A private repo other than the calling repo needs a GitHub App token, because the default token can only read the calling repo.'

inputs:
  repository:
    description: 'The repository to check out, as owner/name.'
    required: true
  ref:
    description: 'The git ref to check out. Leave empty to use the default of actions/checkout. For the calling repository, the default is the ref or commit that started the workflow. This can be a feature branch or a pull request merge commit. For another repository, the default is the default branch of that repository.'
    required: false
    default: ''
  fetch-depth:
    description: 'The number of commits to fetch. 0 fetches all history.'
    required: false
    default: '1'
  client-id:
    description: 'The client ID of a GitHub App that can read the repository. Leave empty to use the default token.'
    required: false
    default: ''
  private-key:
    description: 'The private key of the client-id GitHub App. Leave empty to use the default token.'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Split the repository into owner and name
      id: target
      shell: bash
      env:
        REPOSITORY: ${{ inputs.repository }}
      run: |
        {
          echo "owner=${REPOSITORY%%/*}"
          echo "name=${REPOSITORY#*/}"
        } >> "$GITHUB_OUTPUT"

    - name: Check the client ID
      if: ${{ inputs.client-id == '' && inputs.private-key != '' && inputs.repository != github.repository }}
      shell: bash
      run: echo "::error::A private key was given but the client ID is empty. Check that the org-level TRADE_TARIFF_PR_BOT_GITHUB_CLIENT_ID variable is visible to this repository." && exit 1

    # The calling repo can always read itself, so it needs no app token. The
    # token can only read the one repo. The action masks it and revokes it when
    # the job ends.
    - name: Mint a read-only token for the repository
      id: token
      if: ${{ inputs.client-id != '' && inputs.private-key != '' && inputs.repository != github.repository }}
      uses: actions/create-github-app-token@v3.4.0
      with:
        client-id: ${{ inputs.client-id }}
        private-key: ${{ inputs.private-key }}
        owner: ${{ steps.target.outputs.owner }}
        repositories: ${{ steps.target.outputs.name }}
        permission-contents: read

    - uses: actions/checkout@v7.0.1
      with:
        repository: ${{ inputs.repository }}
        ref: ${{ inputs.ref }}
        fetch-depth: ${{ inputs.fetch-depth }}
        token: ${{ steps.token.outputs.token || github.token }}
