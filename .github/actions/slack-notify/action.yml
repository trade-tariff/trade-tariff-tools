name: Slack Notify
description: Send a notification to a Slack channel

inputs:
  webhook:
    required: false
    description: Slack webhook URL. When omitted, the action logs and exits without posting.
  channel:
    required: false
    default: 'deployments'
    description: Slack channel to post to
  username:
    required: false
    default: 'Deploy Bot'
    description: Bot username displayed in Slack
  icon_emoji:
    required: false
    default: ':robot_face:'
    description: Emoji icon for the bot
  color:
    required: false
    default: 'good'
    description: 'Attachment sidebar color. Accepts: good, danger, warning, success, failure, cancelled, or a hex code'
  title:
    required: false
    default: ''
    description: Message title
  message:
    required: true
    description: Message body (supports Slack mrkdwn formatting)

runs:
  using: composite
  steps:
    - shell: bash
      env:
        WEBHOOK: ${{ inputs.webhook }}
        CHANNEL: ${{ inputs.channel }}
        USERNAME: ${{ inputs.username }}
        ICON_EMOJI: ${{ inputs.icon_emoji }}
        COLOR: ${{ inputs.color }}
        TITLE: ${{ inputs.title }}
        MESSAGE: ${{ inputs.message }}
      run: '"${{ github.action_path }}/send-slack-notification.sh"'
