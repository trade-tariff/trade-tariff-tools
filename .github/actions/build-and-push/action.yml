name: 'Build and push the Docker image'
description: 'Builds the Docker image and pushes it to the ECR repository.'

inputs:
  ecr-url:
    required: true
  ref:
    required: true
  region:
    required: false
    default: 'eu-west-2'
  role-to-assume:
    description: 'The IAM role ARN to assume for AWS operations.'
    required: true
  build-args:
    required: false
    default: ''
  platforms:
    description: 'Comma-separated target platforms. Give more than one (for example linux/amd64,linux/arm64) to push one multi-arch tag.'
    required: false
    default: 'linux/amd64'
runs:
  using: 'composite'
  steps:
    - uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: ${{ inputs.role-to-assume }}
        aws-region: ${{ inputs.region }}

    - name: Check if image already exists in ECR
      id: check-image
      run: |
        REPO_NAME=$(echo "${{ inputs.ecr-url }}" | cut -d'/' -f2)
        REGISTRY_ID=$(echo "${{ inputs.ecr-url }}" | cut -d'.' -f1)
        echo "registry-id=$REGISTRY_ID" >> "$GITHUB_OUTPUT"
        REF=${{ inputs.ref }}
        IMAGE_NAME="${{ inputs.ecr-url }}:$REF"

        if aws ecr describe-images \
          --repository "$REPO_NAME" \
          --image-ids imageTag="$REF" \
          --region "${{ inputs.region }}" \
          --registry-id "$REGISTRY_ID" > /dev/null 2>&1; then
          echo "::notice::Image $IMAGE_NAME already exists in ECR. Skipping build and push."
          echo "exists=true" >> "$GITHUB_OUTPUT"
        else
          echo "::notice::Image $IMAGE_NAME not found in ECR. Proceeding with build and push."
          echo "exists=false" >> "$GITHUB_OUTPUT"
        fi
      shell: bash

    - name: Check existing image platforms
      if: steps.check-image.outputs.exists == 'true' && inputs.platforms != 'linux/amd64'
      shell: bash
      env:
        IMAGE_NAME: ${{ inputs.ecr-url }}:${{ inputs.ref }}
        REGION: ${{ inputs.region }}
        PLATFORMS: ${{ inputs.platforms }}
      run: '"${{ github.action_path }}/check-platforms.sh"'

    - name: Log in to Amazon ECR
      if: steps.check-image.outputs.exists == 'false'
      uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
      with:
        registries: ${{ steps.check-image.outputs.registry-id }}

    - name: Extract build arguments
      if: steps.check-image.outputs.exists == 'false'
      id: extract-build-args
      run: |
        build_args=""
        for arg in ${{ inputs.build-args }}; do
          build_args="$build_args --build-arg $arg"
        done

        echo "::notice::Build arguments extracted: $build_args"
        echo BUILD_ARGS="$build_args" >> "$GITHUB_OUTPUT"
      shell: bash

    - name: Build image
      if: steps.check-image.outputs.exists == 'false' && inputs.platforms == 'linux/amd64'
      id: build-image
      run: |
        REF=${{ inputs.ref }}
        IMAGE_NAME="${{ inputs.ecr-url }}:$REF"

        echo "$REF" > REVISION
        docker build --provenance=false -t "$IMAGE_NAME" . ${{ steps.extract-build-args.outputs.BUILD_ARGS }}
        echo "image_name=$IMAGE_NAME" >> "$GITHUB_OUTPUT"
      shell: bash

    - name: Scan image for vulnerabilities
      if: steps.check-image.outputs.exists == 'false' && inputs.platforms == 'linux/amd64'
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        image-ref: ${{ steps.build-image.outputs.image_name }}
        severity: 'CRITICAL,HIGH'
        ignore-unfixed: true
        exit-code: '1'

    - name: Push image
      if: steps.check-image.outputs.exists == 'false' && inputs.platforms == 'linux/amd64'
      shell: bash
      env:
        IMAGE_NAME: ${{ steps.build-image.outputs.image_name }}
        REGION: ${{ inputs.region }}
      run: '"${{ github.action_path }}/push-image.sh"'

    - name: Set up QEMU
      if: steps.check-image.outputs.exists == 'false' && inputs.platforms != 'linux/amd64'
      uses: docker/setup-qemu-action@v4.4.0
      with:
        platforms: ${{ inputs.platforms }}

    - name: Set up Docker Buildx
      if: steps.check-image.outputs.exists == 'false' && inputs.platforms != 'linux/amd64'
      uses: docker/setup-buildx-action@v4.4.1

    # Push without a tag, scan what was pushed, then tag the scanned digest. The tag never points at unscanned content.
    - name: Build and push multi-arch image by digest
      if: steps.check-image.outputs.exists == 'false' && inputs.platforms != 'linux/amd64'
      id: build-multi-arch
      shell: bash
      env:
        ECR_URL: ${{ inputs.ecr-url }}
        PLATFORMS: ${{ inputs.platforms }}
        BUILD_ARGS: ${{ steps.extract-build-args.outputs.BUILD_ARGS }}
      run: |
        REF=${{ inputs.ref }}
        METADATA="$RUNNER_TEMP/build-metadata.json"

        echo "$REF" > REVISION
        # shellcheck disable=SC2086
        docker buildx build --provenance=false --platform "$PLATFORMS" \
          --output "type=image,name=$ECR_URL,push-by-digest=true,name-canonical=true,push=true" \
          --metadata-file "$METADATA" . $BUILD_ARGS
        DIGEST=$(jq -r '."containerimage.digest"' "$METADATA")
        {
          echo "image_name=$ECR_URL:$REF"
          echo "source_image=$ECR_URL@$DIGEST"
        } >> "$GITHUB_OUTPUT"

    - name: Set up Trivy
      if: steps.check-image.outputs.exists == 'false' && inputs.platforms != 'linux/amd64'
      uses: aquasecurity/setup-trivy@v0.3.1
      with:
        version: v0.70.0

    - name: Scan multi-arch image for vulnerabilities
      if: steps.check-image.outputs.exists == 'false' && inputs.platforms != 'linux/amd64'
      shell: bash
      env:
        SOURCE_IMAGE: ${{ steps.build-multi-arch.outputs.source_image }}
        PLATFORMS: ${{ inputs.platforms }}
      run: |
        for platform in ${PLATFORMS//,/ }; do
          trivy image --image-src remote --platform "$platform" --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 "$SOURCE_IMAGE"
        done

    - name: Push multi-arch image
      if: steps.check-image.outputs.exists == 'false' && inputs.platforms != 'linux/amd64'
      shell: bash
      env:
        IMAGE_NAME: ${{ steps.build-multi-arch.outputs.image_name }}
        SOURCE_IMAGE: ${{ steps.build-multi-arch.outputs.source_image }}
        REGION: ${{ inputs.region }}
        PLATFORMS: ${{ inputs.platforms }}
      run: '"${{ github.action_path }}/push-image.sh"'
