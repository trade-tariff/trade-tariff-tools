name: 'Build and push the Docker image'
description: 'Builds the Docker image and pushes it to the ECR repository.'

inputs:
  ecr-url:
    required: true
  ref:
    required: true
  region:
    required: false
    default: 'eu-west-2'
  role-to-assume:
    description: 'The IAM role ARN to assume for AWS operations.'
    required: true
  build-args:
    required: false
    default: ''
  platforms:
    description: 'Comma-separated target platforms: linux/amd64 (required) and optionally linux/arm64. Give both to push one multi-arch tag.'
    required: false
    default: 'linux/amd64'
  digest-only:
    description: 'Build and scan the image on this runner, and push it by digest without a tag. Requires platforms linux/arm64 and an arm64 runner.'
    required: false
    default: 'false'
  arm64-image:
    description: 'The scanned linux/arm64 image by digest, from a digest-only run on an arm64 runner. Required when platforms includes linux/arm64.'
    required: false
    default: ''
outputs:
  source-image:
    description: 'The image that this run pushed by digest: <registry>/<repository>@<digest>.'
    value: ${{ steps.build-multi-arch.outputs.source_image }}
runs:
  using: 'composite'
  steps:
    - name: Validate platforms
      shell: bash
      env:
        PLATFORMS: ${{ inputs.platforms }}
        DIGEST_ONLY: ${{ inputs.digest-only }}
      run: '"${{ github.action_path }}/validate-platforms.sh"'

    - uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: ${{ inputs.role-to-assume }}
        aws-region: ${{ inputs.region }}

    - name: Check if image already exists in ECR
      id: check-image
      run: |
        REPO_NAME=$(echo "${{ inputs.ecr-url }}" | cut -d'/' -f2)
        REGISTRY_ID=$(echo "${{ inputs.ecr-url }}" | cut -d'.' -f1)
        echo "registry-id=$REGISTRY_ID" >> "$GITHUB_OUTPUT"
        REF=${{ inputs.ref }}
        IMAGE_NAME="${{ inputs.ecr-url }}:$REF"

        if aws ecr describe-images \
          --repository "$REPO_NAME" \
          --image-ids imageTag="$REF" \
          --region "${{ inputs.region }}" \
          --registry-id "$REGISTRY_ID" > /dev/null 2>&1; then
          echo "::notice::Image $IMAGE_NAME already exists in ECR. Skipping build and push."
          echo "exists=true" >> "$GITHUB_OUTPUT"
        else
          echo "::notice::Image $IMAGE_NAME not found in ECR. Proceeding with build and push."
          echo "exists=false" >> "$GITHUB_OUTPUT"
        fi
      shell: bash

    - name: Check existing image platforms
      if: steps.check-image.outputs.exists == 'true' && inputs.platforms != 'linux/amd64'
      shell: bash
      env:
        IMAGE_NAME: ${{ inputs.ecr-url }}:${{ inputs.ref }}
        REGION: ${{ inputs.region }}
        PLATFORMS: ${{ inputs.platforms }}
      run: '"${{ github.action_path }}/check-platforms.sh"'

    - name: Log in to Amazon ECR
      if: steps.check-image.outputs.exists == 'false'
      uses: aws-actions/amazon-ecr-login@7290e214a610b32bc0eef81748948b6d466a8783 # v2.2.0
      with:
        registries: ${{ steps.check-image.outputs.registry-id }}

    - name: Extract build arguments
      if: steps.check-image.outputs.exists == 'false'
      id: extract-build-args
      run: |
        build_args=""
        for arg in ${{ inputs.build-args }}; do
          build_args="$build_args --build-arg $arg"
        done

        echo "::notice::Build arguments extracted: $build_args"
        echo BUILD_ARGS="$build_args" >> "$GITHUB_OUTPUT"
      shell: bash

    - name: Build image
      if: steps.check-image.outputs.exists == 'false' && inputs.platforms == 'linux/amd64'
      id: build-image
      run: |
        REF=${{ inputs.ref }}
        IMAGE_NAME="${{ inputs.ecr-url }}:$REF"

        echo "$REF" > REVISION
        docker build --provenance=false -t "$IMAGE_NAME" . ${{ steps.extract-build-args.outputs.BUILD_ARGS }}
        echo "image_name=$IMAGE_NAME" >> "$GITHUB_OUTPUT"
      shell: bash

    - name: Scan image for vulnerabilities
      if: steps.check-image.outputs.exists == 'false' && inputs.platforms == 'linux/amd64'
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        image-ref: ${{ steps.build-image.outputs.image_name }}
        severity: 'CRITICAL,HIGH'
        ignore-unfixed: true
        exit-code: '1'

    - name: Push image
      if: steps.check-image.outputs.exists == 'false' && inputs.platforms == 'linux/amd64'
      shell: bash
      env:
        IMAGE_NAME: ${{ steps.build-image.outputs.image_name }}
        REGION: ${{ inputs.region }}
        # Clear any PLATFORMS from the caller job, so that push-image.sh does a docker push.
        PLATFORMS: ''
      run: '"${{ github.action_path }}/push-image.sh"'

    - name: Set up Docker Buildx
      if: steps.check-image.outputs.exists == 'false' && inputs.platforms != 'linux/amd64'
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    # Each platform builds natively on its own runner. A digest-only run builds its one platform.
    # Otherwise this runner builds linux/amd64 and the tag adds arm64-image.
    # Push without a tag, scan what was pushed, then tag the scanned digests. The tag never points at unscanned content.
    - name: Build and push image by digest
      if: steps.check-image.outputs.exists == 'false' && inputs.platforms != 'linux/amd64'
      id: build-multi-arch
      shell: bash
      env:
        ECR_URL: ${{ inputs.ecr-url }}
        REF: ${{ inputs.ref }}
        PLATFORMS: ${{ inputs.digest-only == 'true' && inputs.platforms || 'linux/amd64' }}
        BUILD_ARGS: ${{ steps.extract-build-args.outputs.BUILD_ARGS }}
      run: '"${{ github.action_path }}/build-multi-arch.sh"'

    - name: Set up Trivy
      if: steps.check-image.outputs.exists == 'false' && inputs.platforms != 'linux/amd64'
      uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
      with:
        version: v0.70.0

    - name: Scan image by digest for vulnerabilities
      if: steps.check-image.outputs.exists == 'false' && inputs.platforms != 'linux/amd64'
      shell: bash
      env:
        SOURCE_IMAGE: ${{ steps.build-multi-arch.outputs.source_image }}
        PLATFORMS: ${{ inputs.digest-only == 'true' && inputs.platforms || 'linux/amd64' }}
      run: '"${{ github.action_path }}/scan-image.sh"'

    - name: Push multi-arch image
      if: steps.check-image.outputs.exists == 'false' && inputs.platforms != 'linux/amd64' && inputs.digest-only != 'true'
      shell: bash
      env:
        IMAGE_NAME: ${{ steps.build-multi-arch.outputs.image_name }}
        SOURCE_IMAGE: ${{ steps.build-multi-arch.outputs.source_image }} ${{ inputs.arm64-image }}
        REGION: ${{ inputs.region }}
        PLATFORMS: ${{ inputs.platforms }}
      run: '"${{ github.action_path }}/push-image.sh"'
