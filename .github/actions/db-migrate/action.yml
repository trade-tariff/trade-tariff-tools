name: 'Run database migrations'
description: 'Applies schema changes pre-deployment.'

env:
  TF_INPUT: 0
  TF_IN_AUTOMATION: 1
  TERRAFORM_VERSION: 1.12

inputs:
  app-name:
    description: 'The app being deployed, for example tariff-backend or tariff-dev-hub.'
    required: true
  environment:
    description: 'The name of the environment to perform the migration in'
    required: true
  region:
    required: false
    default: 'eu-west-2'
  ref:
    required: true
    description: 'The git ref to deploy.'
  previous-ref:
    required: false
    default: ''
    description: 'The git ref currently running in this environment. When set, the migration tasks are skipped if no migration file changed between this ref and ref.'
  role-to-assume:
    description: 'The IAM role ARN to assume for AWS operations.'
    required: true

runs:
  using: 'composite'
  steps:
    - uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: ${{ inputs.role-to-assume }}
        aws-region: ${{ inputs.region }}

    - uses: hashicorp/setup-terraform@v4
      with:
        terraform_version: ${{ env.TERRAFORM_VERSION }}

    - name: Apply database migrations
      shell: bash
      env:
        APP_NAME: ${{ inputs.app-name }}
        ENVIRONMENT: ${{ inputs.environment }}
        REF: ${{ inputs.ref }}
        PREVIOUS_REF: ${{ inputs.previous-ref }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        args=(--app-name "$APP_NAME" --environment "$ENVIRONMENT" --ref "$REF")

        if [[ -n "$PREVIOUS_REF" ]]; then
          args+=(--previous-ref "$PREVIOUS_REF")
        fi

        "$ACTION_PATH/../../../bin/db-migrate" "${args[@]}"

    - name: Force unlock terraform state on cancellation
      if: cancelled()
      shell: bash
      env:
        ENVIRONMENT: ${{ inputs.environment }}
      run: |
        BUCKET=$(grep '^bucket' "terraform/backends/${ENVIRONMENT}.tfbackend" | awk -F'"' '{print $2}')
        KEY=$(grep '^key' "terraform/backends/${ENVIRONMENT}.tfbackend" | awk -F'"' '{print $2}')
        aws s3 cp "s3://${BUCKET}/${KEY}.tflock" /tmp/terraform.tflock || exit 0
        LOCK_ID=$(jq -r '.ID' /tmp/terraform.tflock)
        cd terraform && terraform force-unlock -force "${LOCK_ID}"
