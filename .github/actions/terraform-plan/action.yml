name: 'Plan Terraform'
description: 'Run a terraform plan command to validate the changes.'

env:
  TF_INPUT: 0
  TF_IN_AUTOMATION: 1
  TERRAFORM_VERSION: 1.12

inputs:
  environment:
    required: true
    description: 'The environment to verify with the plan.'
  ref:
    required: true
    description: 'The git ref we plan to deploy.'
  role-to-assume:
    description: 'The IAM role ARN to assume for AWS operations.'
    required: true
  region:
    required: false
    default: 'eu-west-2'
  modules-app-id:
    description: 'GitHub App ID that can read the private Terraform modules repo. Leave empty to skip.'
    required: false
    default: ''
  modules-app-private-key:
    description: 'Private key of that GitHub App. Leave empty to skip.'
    required: false
    default: ''
runs:
  using: 'composite'
  steps:
    - uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: ${{ inputs.role-to-assume }}
        aws-region: ${{ inputs.region }}
    - uses: hashicorp/setup-terraform@v4
      with:
        terraform_version: ${{ env.TERRAFORM_VERSION }}
    - uses: trade-tariff/trade-tariff-tools/.github/actions/setup-private-terraform-modules@main
      with:
        app-id: ${{ inputs.modules-app-id }}
        private-key: ${{ inputs.modules-app-private-key }}
    - run: cd terraform && terraform init -backend-config=backends/${{ inputs.environment }}.tfbackend
      shell: bash
    - run: cd terraform && terraform plan -var-file=config_${{ inputs.environment }}.tfvars -lock=false
      shell: bash
      env:
        TF_VAR_docker_tag: ${{ inputs.ref }}
