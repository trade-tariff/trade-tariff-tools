---
name: "Deploy to ECS v2"

on:
  workflow_call:
    inputs:
      environment:
        description: "The environment to plan and apply against"
        type: "string"
        required: true
      app-name:
        description: "The app name to push the Docker image to"
        type: "string"
        required: true
      test-projects:
        description: "Comma-separated E2E projects: api, admin, frontend, dev-hub, myott. An empty value skips E2E tests."
        type: "string"
        default: "api,frontend"
        required: false
      skip-passwordless:
        description: "Skip passwordless verification in E2E tests."
        type: "boolean"
        default: true
        required: false
      build-args:
        description: "Additional space-separated build arguments for the Docker image"
        type: "string"
        default: ""
        required: false
      checkout-repo:
        description: "The repository to checkout (defaults to current repo)"
        type: "string"
        default: ""
        required: false
      checkout-ref:
        description: "The ref to checkout (defaults to current ref)"
        type: "string"
        default: ""
        required: false
      migrate:
        description: "Whether to run database migrations before deployment"
        type: "boolean"
        default: false
        required: false
      force-migrate:
        description: "Run the database migrations even when no migration file changed since the running image, for example after a database restore. Implies migrate"
        type: "boolean"
        default: false
        required: false
      notify:
        description: "Whether to send notifications to Slack"
        type: "boolean"
        default: true
        required: false
      terraform-vars:
        description: "Terraform variables that replace the var file values in the apply, one name=value on each line"
        type: "string"
        default: ""
        required: false

    secrets:
      slack-webhook:
        description: "The Slack webhook URL to send notifications to"
        required: true
      basic-password:
        description: "The basic auth password"
        required: false
      waf_bypass_token:
        description: "Secret token sent in X-WAF-Bypass header to bypass WAF bot control"
        required: false

permissions:
  contents: "read"
  id-token: "write"

jobs:
  configure:
    runs-on: "ubuntu-latest"
    outputs:
      actual_repo: "${{ steps.actual-ref.outputs.actual_repo }}"
      actual_ref: "${{ steps.actual-ref.outputs.actual_ref }}"
      docker_tag: "${{ steps.config.outputs.docker_tag }}"
      ecr_url: "${{ steps.config.outputs.ecr_url }}"
      iam_role_arn: "${{ steps.config.outputs.iam_role_arn }}"
      previous_docker_tag: "${{ steps.config.outputs.previous_docker_tag }}"
      ruby_version: "${{ steps.config.outputs.ruby_version }}"
      slack_channel: "${{ steps.config.outputs.slack_channel }}"
    steps:
      - id: "actual-ref"
        env:
          CHECKOUT_REPO: "${{ inputs.checkout-repo }}"
          CHECKOUT_REF: "${{ inputs.checkout-ref }}"
          DEFAULT_REPOSITORY: "${{ github.repository }}"
          DEFAULT_REF: "${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha || github.sha }}"
        run: |
          ACTUAL_REPO="${CHECKOUT_REPO:-$DEFAULT_REPOSITORY}"

          if [[ -n "$CHECKOUT_REF" ]]; then
            ACTUAL_REF="$CHECKOUT_REF"
          elif [[ "$ACTUAL_REPO" == "$DEFAULT_REPOSITORY" ]]; then
            ACTUAL_REF="$DEFAULT_REF"
          else
            ACTUAL_REF="main"
          fi

          if [[ "$ACTUAL_REPO$ACTUAL_REF" == *$'\n'* || "$ACTUAL_REPO$ACTUAL_REF" == *$'\r'* ]]; then
            echo "Repository and ref values must not contain line breaks" >&2
            exit 2
          fi

          printf 'actual_repo=%s\nactual_ref=%s\n' "$ACTUAL_REPO" "$ACTUAL_REF" >> "$GITHUB_OUTPUT"

      - uses: "actions/checkout@v7.0.1"
        with:
          repository: "${{ steps.actual-ref.outputs.actual_repo }}"
          ref: "${{ steps.actual-ref.outputs.actual_ref }}"

      - id: "environment-config"
        uses: "trade-tariff/trade-tariff-tools/.github/actions/configure-environment@main"
        with:
          app-name: "${{ inputs.app-name }}"
          environment: "${{ inputs.environment }}"

      - uses: "aws-actions/configure-aws-credentials@v6.3.0"
        with:
          role-to-assume: "${{ steps.environment-config.outputs.deploy-role-arn }}"
          aws-region: "eu-west-2"

      - id: "config"
        env:
          APP_NAME: "${{ inputs.app-name }}"
          CLUSTER: "${{ steps.environment-config.outputs.cluster }}"
          ECR_URL: "${{ steps.environment-config.outputs.ecr-url }}"
          IAM_ROLE_ARN: "${{ steps.environment-config.outputs.deploy-role-arn }}"
          SLACK_CHANNEL: "${{ steps.environment-config.outputs.slack-channel }}"
        run: |
          PREVIOUS_DOCKER_TAG=""
          # Derive the ECS service name from the app name. Services follow the
          # pattern <name>-<suffix> where <name> is either the full app name
          # (e.g. tariff-dev-hub) or the name with the tariff- prefix stripped
          # (e.g. tariff-backend -> backend-uk). We pick the first matching
          # service; all services of one app run the same image tag.
          REPO_NAME="${APP_NAME#tariff-}"
          if [[ -z "$APP_NAME" || -z "$REPO_NAME" || "$APP_NAME" == *[[:space:]]* ]]; then
            echo "app-name must be a non-empty single token" >&2
            exit 1
          fi
          SERVICES=$(aws ecs list-services --cluster "$CLUSTER" --query 'serviceArns' --output text)
          for SERVICE_ARN in $SERVICES; do
            SERVICE_NAME=$(basename "$SERVICE_ARN")
            if [[ "$SERVICE_NAME" == "$APP_NAME"* || "$SERVICE_NAME" == "$REPO_NAME"* ]]; then
              TASK_DEF=$(aws ecs describe-services \
                --cluster "$CLUSTER" \
                --services "$SERVICE_NAME" \
                --query 'services[0].taskDefinition' \
                --output text)
              IMAGE=$(aws ecs describe-task-definition \
                --task-definition "$TASK_DEF" \
                --query 'taskDefinition.containerDefinitions[0].image' \
                --output text)
              PREVIOUS_DOCKER_TAG="${IMAGE##*:}"
              break
            fi
          done
          RUBY_VERSION="$(cat .ruby-version)"
          for OUTPUT_NAME in ECR_URL IAM_ROLE_ARN PREVIOUS_DOCKER_TAG RUBY_VERSION SLACK_CHANNEL; do
            if [[ "${!OUTPUT_NAME}" == *[[:cntrl:]]* ]]; then
              echo "$OUTPUT_NAME contains control characters" >&2
              exit 1
            fi
          done
          {
            printf 'ecr_url=%s\n' "$ECR_URL"
            printf 'iam_role_arn=%s\n' "$IAM_ROLE_ARN"
            printf 'previous_docker_tag=%s\n' "$PREVIOUS_DOCKER_TAG"
            printf 'ruby_version=%s\n' "$RUBY_VERSION"
            printf 'slack_channel=%s\n' "$SLACK_CHANNEL"
            printf 'docker_tag=%s\n' "$(git rev-parse --short HEAD)"
          } >> "$GITHUB_OUTPUT"

  build:
    runs-on: "ubuntu-latest"
    needs: "configure"
    steps:
      - uses: "actions/checkout@v7.0.1"
        with:
          repository: "${{ needs.configure.outputs.actual_repo }}"
          ref: "${{ needs.configure.outputs.actual_ref }}"
      - uses: "trade-tariff/trade-tariff-tools/.github/actions/terraform-plan@main"
        with:
          environment: "${{ inputs.environment }}"
          ref: "${{ needs.configure.outputs.docker_tag }}"
          role-to-assume: "${{ needs.configure.outputs.iam_role_arn }}"
      - uses: "trade-tariff/trade-tariff-tools/.github/actions/build-and-push@main"
        with:
          build-args: "RUBY_VERSION=${{ needs.configure.outputs.ruby_version }} ALPINE_VERSION=3.24 ${{ inputs.build-args }}"
          ecr-url: "${{ needs.configure.outputs.ecr_url }}"
          ref: "${{ needs.configure.outputs.docker_tag }}"
          role-to-assume: "${{ needs.configure.outputs.iam_role_arn }}"

  deploy:
    runs-on: "ubuntu-latest"
    needs:
      - "configure"
      - "build"
    steps:
      - uses: "actions/checkout@v7.0.1"
        with:
          repository: "${{ needs.configure.outputs.actual_repo }}"
          ref: "${{ needs.configure.outputs.actual_ref }}"
          fetch-depth: 0
      - uses: "trade-tariff/trade-tariff-tools/.github/actions/db-migrate@main"
        if: "${{ inputs.migrate || inputs.force-migrate }}"
        with:
          app-name: "${{ inputs.app-name }}"
          environment: "${{ inputs.environment }}"
          ref: "${{ needs.configure.outputs.docker_tag }}"
          # Without a previous ref, db-migrate always runs the migrations.
          previous-ref: "${{ !inputs.force-migrate && needs.configure.outputs.previous_docker_tag || '' }}"
          role-to-assume: "${{ needs.configure.outputs.iam_role_arn }}"
      - uses: "trade-tariff/trade-tariff-tools/.github/actions/terraform-apply@main"
        with:
          environment: "${{ inputs.environment }}"
          ref: "${{ needs.configure.outputs.docker_tag }}"
          role-to-assume: "${{ needs.configure.outputs.iam_role_arn }}"
          vars: "${{ inputs.terraform-vars }}"

  tag:
    if: "${{ inputs.environment == 'production' }}"
    runs-on: "ubuntu-latest"
    needs:
      - "configure"
      - "deploy"
    steps:
      - uses: "actions/checkout@v7.0.1"
        with:
          repository: "${{ needs.configure.outputs.actual_repo }}"
          ref: "${{ needs.configure.outputs.actual_ref }}"
      - uses: "trade-tariff/trade-tariff-tools/.github/actions/tag-production@main"
        with:
          ecr-url: "${{ needs.configure.outputs.ecr_url }}"
          ref: "${{ needs.configure.outputs.docker_tag }}"
          role-to-assume: "${{ needs.configure.outputs.iam_role_arn }}"

  e2e-test:
    if: "${{ inputs.test-projects != '' }}"
    uses: "trade-tariff/trade-tariff-tools/.github/workflows/e2e-tests-v2.yml@main"
    needs: "deploy"
    with:
      test-environment: "${{ inputs.environment }}"
      projects: "${{ inputs.test-projects }}"
      skip-passwordless: "${{ inputs.skip-passwordless }}"
    secrets:
      basic_password: "${{ secrets.basic-password }}"
      waf_bypass_token: "${{ secrets.waf_bypass_token }}"

  rollback:
    name: "Rollback on e2e failure"
    if: |
      always() &&
      needs.deploy.result == 'success' &&
      needs.e2e-test.result == 'failure' &&
      needs.configure.outputs.previous_docker_tag != '' &&
      (inputs.environment == 'staging' || inputs.environment == 'production')
    runs-on: "ubuntu-latest"
    needs:
      - "configure"
      - "deploy"
      - "e2e-test"
    steps:
      - uses: "actions/checkout@v7.0.1"
        with:
          repository: "${{ needs.configure.outputs.actual_repo }}"
          ref: "${{ needs.configure.outputs.actual_ref }}"
      - uses: "trade-tariff/trade-tariff-tools/.github/actions/rollback@main"
        with:
          environment: "${{ inputs.environment }}"
          previous-ref: "${{ needs.configure.outputs.previous_docker_tag }}"
          role-to-assume: "${{ needs.configure.outputs.iam_role_arn }}"

  notify:
    if: "${{ always() && inputs.notify }}"
    runs-on: "ubuntu-latest"
    needs:
      - "configure"
      - "build"
      - "deploy"
      - "e2e-test"
      - "rollback"
    steps:
      - uses: "actions/checkout@v7.0.1"
        with:
          repository: "${{ needs.configure.outputs.actual_repo }}"
          ref: "${{ needs.configure.outputs.actual_ref }}"
      - id: "workflow-source"
        env:
          JOB_CONTEXT: "${{ toJson(job) }}"
        run: |
          {
            echo "repository=$(echo "$JOB_CONTEXT" | jq -r '.workflow_repository')"
            echo "sha=$(echo "$JOB_CONTEXT" | jq -r '.workflow_sha')"
          } >> "$GITHUB_OUTPUT"
      - uses: "actions/checkout@v7.0.1"
        with:
          repository: "${{ steps.workflow-source.outputs.repository }}"
          ref: "${{ steps.workflow-source.outputs.sha }}"
          path: ".trade-tariff-tools"
      - id: "result"
        env:
          BUILD_RESULT: "${{ needs.build.result }}"
          DEPLOY_RESULT: "${{ needs.deploy.result }}"
          ENVIRONMENT: "${{ inputs.environment }}"
          E2E_TEST_RESULT: "${{ needs.e2e-test.result }}"
          PREVIOUS_DOCKER_TAG: "${{ needs.configure.outputs.previous_docker_tag }}"
          ROLLBACK_RESULT: "${{ needs.rollback.result }}"
          TEST_PROJECTS: "${{ inputs.test-projects }}"
        run: |
          .trade-tariff-tools/scripts/deploy-result-v2.sh

          if [[ "$ROLLBACK_RESULT" == "success" ]]; then
            echo "rollback_message=Rolled back to \`${PREVIOUS_DOCKER_TAG}\`" >> "$GITHUB_OUTPUT"
          elif [[ "$ROLLBACK_RESULT" == "failure" ]]; then
            echo "rollback_message=Rollback to \`${PREVIOUS_DOCKER_TAG}\` FAILED — manual intervention required" >> "$GITHUB_OUTPUT"
          else
            echo "rollback_message=" >> "$GITHUB_OUTPUT"
          fi

      - id: "pr-info"
        continue-on-error: true
        env:
          GH_TOKEN: "${{ github.token }}"
          DEPLOY_SHA: "${{ needs.configure.outputs.docker_tag }}"
          PR_NUMBER: "${{ github.event.pull_request.number }}"
          REPO: "${{ github.repository }}"
          SHA: "${{ needs.configure.outputs.actual_ref }}"
          TRIGGER_SHA: "${{ github.event.workflow_run.head_sha || github.event.pull_request.merge_commit_sha || github.event.pull_request.head.sha || github.sha }}"
          ENVIRONMENT: "${{ inputs.environment }}"
          RESULT: "${{ steps.result.outputs.result }}"
          SUMMARY: "${{ steps.result.outputs.summary }}"
        run: ".trade-tariff-tools/scripts/deploy-pr-info.sh"

      - id: "notify-message"
        env:
          BASE: "${{ steps.pr-info.outputs.message || steps.result.outputs.summary }}"
          ROLLBACK: "${{ steps.result.outputs.rollback_message }}"
        run: |
          message="$BASE"
          if [[ -n "$ROLLBACK" ]]; then
            message="${message} — ${ROLLBACK}"
          fi

          {
            echo 'message<<NOTIFY_EOF'
            printf '%s\n' "$message"
            echo 'NOTIFY_EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: "trade-tariff/trade-tariff-tools/.github/actions/slack-notify@main"
        with:
          webhook: "${{ secrets.slack-webhook }}"
          channel: "${{ needs.configure.outputs.slack_channel }}"
          color: "${{ steps.result.outputs.result }}"
          title: "${{ github.workflow }}"
          message: "${{ steps.notify-message.outputs.message }}"
      - env:
          RESULT: "${{ steps.result.outputs.result }}"
        run: 'if [[ "$RESULT" != "success" ]]; then exit 1; fi'
