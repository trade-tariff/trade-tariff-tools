name: Auto-merge low-risk PRs

# Reusable workflow only — triggers live in each consumer repo (e.g. trade-tariff-backend).
on:
  workflow_call:
    inputs:
      label:
        description: PR label that enables auto-merge.
        type: string
        required: false
        default: low-risk
      merge-method:
        description: 'merge, squash, or rebase.'
        type: string
        required: false
        default: merge
      required-workflow:
        description: Workflow file that must succeed for the current pull request head.
        type: string
        required: false
        default: ci.yml

    secrets:
      pr-bot-app-id:
        description: >-
          trade-tariff-pr-bot GitHub App ID, from the org-level
          TRADE_TARIFF_PR_BOT_GITHUB_APP_ID secret.
        required: false
      pr-bot-app-private-key:
        description: >-
          trade-tariff-pr-bot GitHub App private key, from the org-level
          TRADE_TARIFF_PR_BOT_GITHUB_APP_PRIVATE_KEY secret.
        required: false
      github-token:
        description: >-
          Deprecated. Long-lived PAT used to call the GitHub API. Pass the
          pr-bot-app-* secrets instead; this input is removed once every
          caller has migrated.
        required: false

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: >-
      (github.event_name != 'pull_request' || !github.event.pull_request.draft) &&
      (github.event_name != 'pull_request_review' ||
      github.event.review.user.login == 'copilot' ||
      github.event.review.user.login == 'copilot-pull-request-reviewer' ||
      github.event.review.user.login == 'copilot-pull-request-reviewer[bot]' ||
      github.event.review.user.login == 'github-copilot[bot]')
    runs-on: ubuntu-latest
    env:
      # Presence booleans only. Never put a secret value in a job-level env,
      # and note secrets are unavailable to step-level `if:` directly.
      PR_BOT_APP_CONFIGURED: >-
        ${{ secrets['pr-bot-app-id'] != ''
        && secrets['pr-bot-app-private-key'] != '' }}
      LEGACY_TOKEN_CONFIGURED: ${{ secrets['github-token'] != '' }}
    steps:
      - name: Fail fast when no credentials were passed
        if: >-
          env.PR_BOT_APP_CONFIGURED != 'true'
          && env.LEGACY_TOKEN_CONFIGURED != 'true'
        run: |
          echo "::error::No credentials passed to auto-merge-low-risk.yml. Pass pr-bot-app-id and pr-bot-app-private-key from the org-level TRADE_TARIFF_PR_BOT_GITHUB_APP_* secrets."
          exit 1

      # Mints a short-lived installation token scoped to the caller repository
      # only. The action masks the token and revokes it when the job ends.
      - name: Mint trade-tariff-pr-bot token
        id: app-token
        if: env.PR_BOT_APP_CONFIGURED == 'true'
        uses: actions/create-github-app-token@v3.2.0
        with:
          app-id: ${{ secrets['pr-bot-app-id'] }}
          private-key: ${{ secrets['pr-bot-app-private-key'] }}
          permission-actions: read
          permission-checks: read
          permission-contents: write
          permission-pull-requests: write

      - name: Resolve pull request number
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail

          case "${{ github.event_name }}" in
            pull_request|pull_request_review)
              echo "number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
              ;;
            workflow_run)
              if [[ "${{ github.event.workflow_run.conclusion }}" != "success" ]]; then
                echo "number=" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              branch="$HEAD_BRANCH"
              number="$(gh pr list \
                --repo "${{ github.repository }}" \
                --head "$branch" \
                --state open \
                --json number \
                -q '.[0].number' || true)"
              if [[ -z "$number" || "$number" == "null" ]]; then
                echo "number=" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "number=$number" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "number=" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Auto-merge when requirements are met
        if: steps.pr.outputs.number != ''
        uses: trade-tariff/trade-tariff-tools/.github/actions/auto-merge-low-risk@main
        with:
          pr-number: ${{ steps.pr.outputs.number }}
          label: ${{ inputs.label }}
          merge-method: ${{ inputs.merge-method }}
          required-workflow: ${{ inputs.required-workflow }}
          github-token: ${{ steps.app-token.outputs.token || secrets['github-token'] }}
          pull-request-event-action: ${{ github.event.action }}
          pull-request-event-label: ${{ github.event.label.name }}
