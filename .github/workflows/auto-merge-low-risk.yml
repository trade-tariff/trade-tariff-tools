name: Auto-merge low-risk PRs

# Reusable workflow only — triggers live in each consumer repo (e.g. trade-tariff-backend).
on:
  workflow_call:
    inputs:
      label:
        description: PR label that enables auto-merge.
        type: string
        required: false
        default: low-risk
      merge-method:
        description: 'merge, squash, or rebase.'
        type: string
        required: false
        default: merge
      required-workflow:
        description: Workflow file that must succeed for the current pull request head.
        type: string
        required: false
        default: ci.yml

    secrets:
      pr-bot-app-id:
        description: >-
          trade-tariff-pr-bot GitHub App ID, from the org-level
          TRADE_TARIFF_PR_BOT_GITHUB_APP_ID secret.
        required: false
      pr-bot-app-private-key:
        description: >-
          trade-tariff-pr-bot GitHub App private key, from the org-level
          TRADE_TARIFF_PR_BOT_GITHUB_APP_PRIVATE_KEY secret.
        required: false

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    # Events that Dependabot triggers get only Dependabot secrets, so the
    # pr-bot App secrets are empty. Skip them. The workflow_run event after CI
    # gets the Actions secrets and handles Dependabot pull requests.
    if: >-
      (github.event_name == 'workflow_run' || github.actor != 'dependabot[bot]') &&
      (github.event_name != 'workflow_run' ||
      github.event.workflow_run.head_repository.full_name == github.repository) &&
      (github.event_name != 'pull_request' || !github.event.pull_request.draft) &&
      (github.event_name != 'pull_request_review' ||
      github.event.review.user.login == 'copilot' ||
      github.event.review.user.login == 'copilot-pull-request-reviewer' ||
      github.event.review.user.login == 'copilot-pull-request-reviewer[bot]' ||
      github.event.review.user.login == 'github-copilot[bot]')
    runs-on: ubuntu-latest
    env:
      # Booleans, not values: the secrets context is unavailable to a step `if:`.
      PR_BOT_APP_CONFIGURED: >-
        ${{ secrets['pr-bot-app-id'] != ''
        && secrets['pr-bot-app-private-key'] != '' }}
    steps:
      - name: Fail fast when no credentials were passed
        if: env.PR_BOT_APP_CONFIGURED != 'true'
        run: |
          echo "::error::No credentials passed to auto-merge-low-risk.yml. Pass pr-bot-app-id and pr-bot-app-private-key from the org-level TRADE_TARIFF_PR_BOT_GITHUB_APP_* secrets."
          exit 1

      - name: Mint trade-tariff-pr-bot token
        id: app-token
        if: env.PR_BOT_APP_CONFIGURED == 'true'
        uses: actions/create-github-app-token@v3.3.0
        with:
          app-id: ${{ secrets['pr-bot-app-id'] }}
          private-key: ${{ secrets['pr-bot-app-private-key'] }}
          permission-actions: read
          permission-checks: read
          permission-contents: write
          permission-pull-requests: write

      - name: Resolve pull request number
        id: pr
        uses: trade-tariff/trade-tariff-tools/.github/actions/resolve-auto-merge-pr@main
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Auto-merge when requirements are met
        if: steps.pr.outputs.number != ''
        uses: trade-tariff/trade-tariff-tools/.github/actions/auto-merge-low-risk@main
        with:
          pr-number: ${{ steps.pr.outputs.number }}
          label: ${{ inputs.label }}
          merge-method: ${{ inputs.merge-method }}
          required-workflow: ${{ inputs.required-workflow }}
          github-app-token: ${{ steps.app-token.outputs.token }}
          pull-request-event-action: ${{ github.event.action }}
          pull-request-event-label: ${{ github.event.label.name }}
