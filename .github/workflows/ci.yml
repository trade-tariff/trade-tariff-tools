name: CI

on:
  pull_request:
    paths:
      - '.github/workflows/ci.yml'
      - '.github/workflows/axxy-tests.yml'
      - '.github/workflows/close-stale-pull-requests-reusable.yml'
      - '.github/workflows/deploy-ecs.yml'
      - '.github/workflows/deploy-multi-ecs.yml'
      - '.github/workflows/e2e-tests.yml'
      - '.github/workflows/preview-cleanup.yml'
      - '.github/actions/db-migrate/**'
      - '.github/actions/setup-tflint/**'
      - 'bin/**'
      - '.github/actions/auto-merge-low-risk/**'
      - '.github/actions/check-pr-lines/**'
      - '.github/actions/importmap-update/**'
      - '.github/actions/risk-label/**'
      - '.github/workflows/risk-label-reusable.yml'
      - '.github/actions/start-services/**'
      - '.github/actions/stop-services/**'
      - '.github/actions/close-stale-pull-requests/**'
      - '.github/workflows/auto-merge-low-risk.yml'
      - '.github/workflows/auto-merge.yml'
      - 'flake.lock'
      - 'flake.nix'
      - 'scripts/**'
      - 'tests/**'

permissions:
  contents: read

jobs:
  setup-tflint-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install TFLint with the workflow token
        uses: ./.github/actions/setup-tflint

      - name: Verify TFLint is executable
        run: tflint --version

  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Bats
        run: |
          sudo apt-get update
          sudo apt-get install -y bats

      - name: Check bash syntax
        run: |
          for file in bin/* scripts/*.sh scripts/lib/*.sh .github/actions/*/*.sh tests/test_helper.bash; do
            bash -n "$file"
          done

      - name: Run regression tests
        run: bats tests

      - uses: actions/setup-node@v7.0.0

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run Jest tests
        run: yarn test
