name: CI

on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  setup-tflint-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install TFLint with the workflow token
        uses: ./.github/actions/setup-tflint

      - name: Verify TFLint is executable
        run: tflint --version

  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Bats
        run: |
          sudo apt-get update
          sudo apt-get install -y bats

      - name: Check bash syntax
        run: |
          for file in bin/* scripts/*.sh scripts/lib/*.sh .github/actions/*/*.sh tests/test_helper.bash; do
            bash -n "$file"
          done

      - name: Run regression tests
        run: bats tests

      - uses: actions/setup-node@v7.0.0

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run Jest tests
        run: yarn test
