name: Risk Label (reusable)

on:
  workflow_call:

jobs:
  risk-label:
    name: Apply risk label
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Detect risk level and apply label
        uses: trade-tariff/trade-tariff-tools/.github/actions/risk-label@main
