name: Nightly Preview Cleanup

on:
  schedule:
    - cron: '0 0 * * *'  # Every day at midnight UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run only (true/false)'
        required: false
        default: 'true'

permissions:
  contents: read
  id-token: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    outputs:
      destroyed_envs: ${{ steps.cleanup-step.outputs.destroyed_envs }}
      dry_run: ${{ steps.cleanup-step.outputs.dry_run }}
      run_mode: ${{ steps.cleanup-step.outputs.run_mode }}

    env:
      AWS_REGION: eu-west-2
      IAM_ROLE_ARN: arn:aws:iam::844815912454:role/GithubActions-Preview-App-Role
      PREEVY_PROFILE_URL: s3://preevy-profile-store?region=eu-west-2

    steps:
      # Scoped to the two repos this job inspects. The action masks the token
      # and revokes it when the job ends.
      - name: Mint trade-tariff-pr-bot token
        id: app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          app-id: ${{ secrets.TRADE_TARIFF_PR_BOT_GITHUB_APP_ID }}
          private-key: ${{ secrets.TRADE_TARIFF_PR_BOT_GITHUB_APP_PRIVATE_KEY }}
          owner: trade-tariff
          repositories: |
            trade-tariff-admin
            trade-tariff-frontend
          permission-pull-requests: write

      - uses: actions/checkout@v7.0.1
      - run: touch .env # To prevent preevy from failing due to missing .env file

      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ env.IAM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - run: npm install -g preevy

      - name: Clean up preview environments
        id: cleanup-step
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || github.event.inputs.dry_run || 'true' }}
          RUN_MODE: ${{ github.event_name == 'schedule' && 'scheduled' || 'manual' }}
        run: scripts/cleanup-preview-environments.sh

  notifications:
    if: needs.cleanup.outputs.destroyed_envs != '[]' && needs.cleanup.outputs.dry_run == 'false'
    needs: cleanup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: trade-tariff/trade-tariff-tools/.github/actions/slack-notify@main
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK }}
          channel: deployments
          icon_emoji: ':recycle:'
          title: Preview Cleanup Report
          message: |
            *Cleanup completed*
            *Run Mode:* `${{ needs.cleanup.outputs.run_mode }}`
            *Destroyed Environments:*
            ${{ join(fromJson(needs.cleanup.outputs.destroyed_envs), ', ') }}
