name: e2e-tests

on:
  workflow_call:
    inputs:
      test-environment:
        description: 'The e2e-test environment to run against'
        type: string
        required: true
      ref:
        description: 'The e2e-test repo reference to run with'
        type: string
        default: 'main'
        required: false
      base-url:
        description: 'The base URL for the e2e tests'
        type: string
        required: false
      admin-url:
        description: 'The admin URL for the e2e tests'
        type: string
        required: false
      skip-admin:
        description: 'Skip the admin tests'
        type: boolean
        default: true
        required: false
      skip-api:
        description: 'Skip the API tests'
        type: boolean
        default: false
        required: false
      skip-frontend:
        description: 'Skip the frontend tests'
        type: boolean
        default: false
        required: false
      skip-passwordless:
        description: 'Skip the passwordless verification tests'
        type: string
        default: 'true'
        required: false
      region:
        description: 'AWS region to use when assuming IAM role'
        type: string
        default: 'eu-west-2'
        required: false
    secrets:
      basic_password:
        description: 'The basic auth password'
        required: false
      spimm_api_key:
        description: 'Green Lanes SPIMM API key'
        required: false
      waf_bypass_token:
        description: 'Secret token sent in X-WAF-Bypass header to bypass WAF bot control'
        required: false

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          repository: trade-tariff/trade-tariff-e2e-tests
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v7.0.0
        with:
          cache: 'yarn'

      - run: yarn install

      # Skip `--with-deps` on the normal path: it runs `apt-get update` across
      # every APT source on the runner, incl. the pre-installed dl.google.com
      # repo this suite doesn't use, whose flaky mirror has failed scheduled
      # runs on "Hash Sum mismatch". ubuntu-24.04 already ships Chromium's libs.
      - name: Cache Playwright browsers
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browser (Chromium shell)
        id: browser
        continue-on-error: true
        run: |
          for attempt in 1 2 3; do
            yarn playwright install --only-shell chromium && exit 0
            echo "Attempt $attempt failed; retrying in 30s..." && sleep 30
          done
          exit 1

      - name: Fallback - scrub unused APT sources, install deps + browser
        if: steps.browser.outcome == 'failure'
        run: |
          sudo rm -f /etc/apt/sources.list.d/*google* /etc/apt/sources.list.d/*microsoft*
          sudo apt-get update
          yarn playwright install --with-deps --only-shell chromium

      - run: |
          {
            case "${{ inputs.test-environment }}" in
              development)
                ACCOUNT_ID="844815912454"
                ;;
              staging)
                ACCOUNT_ID="451934005581"
                ;;
              *)
                ACCOUNT_ID=""
                ;;
            esac
            if [ -n "${{ inputs.admin-url }}" ]; then
              echo "ADMIN_URL=${{ inputs.admin-url }}"
            fi
            if [ -n "${{ inputs.base-url }}" ]; then
              echo "BASE_URL=${{ inputs.base-url }}"
            fi
            echo "BASIC_PASSWORD=${{ secrets.basic_password }}"
            echo "SPIMM_API_KEY=${{ secrets.spimm_api_key }}"
            echo "WAF_BYPASS_TOKEN=${{ secrets.waf_bypass_token }}"

            echo "PLAYWRIGHT_ENV=${{ inputs.test-environment }}"
            echo "CI=true"
            echo "ROLE_TO_ASSUME=arn:aws:iam::${ACCOUNT_ID}:role/GithubActions-E2E-Testing-Role"
          } >> "$GITHUB_ENV"

      - uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}
          aws-region: ${{ inputs.region }}
        if: ${{ inputs['test-environment'] == 'development' || inputs['test-environment'] == 'staging' }}

      - run: yarn run test
        env:
          SKIP_ADMIN: ${{ inputs.skip-admin }}
          SKIP_API: ${{ inputs.skip-api }}
          SKIP_FRONTEND: ${{ inputs.skip-frontend }}
          SKIP_PASSWORDLESS_VERIFICATION: ${{ inputs.skip-passwordless }}
          DOTENV_CONFIG_QUIET: true
