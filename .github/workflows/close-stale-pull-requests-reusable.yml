name: Close stale pull requests (reusable)

on:
  workflow_call:
    inputs:
      stale_days:
        description: Close pull requests with no activity for at least this many days
        required: false
        type: number
        default: 14
      keep_label:
        description: Label that exempts a pull request from automatic closure
        required: false
        type: string
        default: keep
      dry_run:
        description: List pull requests that would be closed without closing them
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

jobs:
  close-stale:
    runs-on: ubuntu-latest
    steps:
      - name: Close stale pull requests and branches
        uses: trade-tariff/trade-tariff-tools/.github/actions/close-stale-pull-requests@main
        with:
          stale_days: ${{ inputs.stale_days }}
          keep_label: ${{ inputs.keep_label }}
          dry_run: ${{ inputs.dry_run }}
