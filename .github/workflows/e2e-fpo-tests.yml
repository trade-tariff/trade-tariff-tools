name: e2e-fpo-tests

on:
  workflow_call:
    inputs:
      test-environment:
        description: 'The e2e-test environment to run against'
        type: string
        default: 'development'
      ref:
        description: 'The e2e-test repo reference to run with'
        type: string
        default: 'main'
      region:
        description: 'AWS region to use when assuming IAM role'
        type: string
        default: 'eu-west-2'
        required: false
    secrets:
      non_admin_bypass_password:
        description: 'Password for non-admin bypass'
        required: false
      admin_bypass_password:
        description: 'Password for admin bypass'
        required: false
      waf_bypass_token:
        description: 'Token sent as X-WAF-Bypass to skip WAF rate limiting (see terraform TF_VAR_WAF_E2E_SECRET_TOKEN)'
        required: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          repository: trade-tariff/trade-tariff-fpo-dev-hub-e2e
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v7.0.0
        with:
          cache: 'yarn'

      # --ignore-scripts: this workflow now also runs for dependabot PRs via
      # pull_request_target (see trade-tariff-fpo-dev-hub-e2e's development.yml),
      # which puts real secrets (WAF_BYPASS_TOKEN, an AWS OIDC role) in scope
      # for an unreviewed dependency bump's code. Skipping lifecycle scripts
      # blocks the standard "malicious postinstall" exfiltration vector; it
      # doesn't cover a compromised package's own code executing later when
      # `yarn run test` actually imports it (e.g. mailparser, @aws-sdk/*).
      - run: yarn install --ignore-scripts

      - run: yarn playwright install --with-deps chromium

      - run: |
          {
            case "${{ inputs.test-environment }}" in
              development)
                ACCOUNT_ID="844815912454"
                ;;
              staging)
                ACCOUNT_ID="451934005581"
                ;;
              *)
                ACCOUNT_ID=""
                ;;
            esac
            echo "ROLE_TO_ASSUME=arn:aws:iam::${ACCOUNT_ID}:role/GithubActions-E2E-Testing-Role"
          } >> "$GITHUB_ENV"


      - uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}
          aws-region: ${{ inputs.region }}
        if: ${{ inputs['test-environment'] == 'development' || inputs['test-environment'] == 'staging' }}

      - run: yarn run test
        env:
          ADMIN_BYPASS_PASSWORD: ${{ secrets.admin_bypass_password }}
          NON_ADMIN_BYPASS_PASSWORD: ${{ secrets.non_admin_bypass_password }}
          WAF_BYPASS_TOKEN: ${{ secrets.waf_bypass_token }}
          CI: true
          PLAYWRIGHT_ENV: ${{ inputs.test-environment }}
